[project]
name = "cargobay"
version = "0.1.0"
description = "Spoolman-style API for SpoolmanScale backed by 3dfilamentprofiles.com"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cargobay"]

[dependency-groups]
dev = ["pytest", "pytest-aiohttp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
