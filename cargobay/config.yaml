name: Cargo Bay
slug: cargobay
version: "0.1.1"
description: Spoolman-style API for SpoolmanScale backed by 3dfilamentprofiles.com, bound to Bambu AMS trays
url: https://github.com/louisalexander/cargobay
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
watchdog: "tcp://[HOST]:[PORT:7912]"
ports:
  7912/tcp: 7912
ports_description:
  7912/tcp: SpoolmanScale inventory API
map:
  - type: homeassistant_config
    read_only: true
options:
  api_key: ""
  bind_window_s: 300
  ams_control: notify
  extra_locations: []
  profile_overrides: []
schema:
  api_key: password
  bind_window_s: int(30,3600)
  ams_control: list(notify|ha_set_filament)
  extra_locations:
    - str
  profile_overrides:
    - filament: str
      tray_info_idx: str
      nozzle_temp_min: int?
      nozzle_temp_max: int?
